# History
set -g history-file ~/.tmux_history
set -g history-limit 25000

# Vi moves
setw -g mode-keys vi

# Scroll with mouse
set-option -g mouse on

# UI
set -g status-justify left

# Name panes
set -g pane-border-status top
set -g pane-border-format " [ #T #{?window_zoomed_flag,(zoom) ,}] "
bind r command-prompt "select-pane -T '%%'"

## Better UX
bind -n M-r source-file ~/.tmux.conf \; display-message "Config reloaded!"
bind -n M-z resize-pane -Z \; display-message "Zoom"

# Shift+Right: next window
bind -n S-Right next-window
bind -n M-= next-window

# Shift+Right: prev window
bind -n S-Left previous-window
bind -n M-- previous-window

# Ctrl+Shift+Right: move window to the right
bind -n C-S-Right swap-window -t +1 \; next-window

# Ctrl+Shift+Left: move window to the left
bind -n C-S-Left swap-window -t -1 \; previous-window

# Alt+Right: move to right pane
bind -n M-Right select-pane -R
bind -n M-l select-pane -R
bind -n M-S-Right resize-pane -R 2
bind -n M-L select-pane -R

# Alt+Left: move to left pane
bind -n M-Left select-pane -L
bind -n M-h select-pane -L
bind -n M-S-Left resize-pane -L 2
bind -n M-H select-pane -L

# Alt+Up: move to upper pane
bind -n M-Up select-pane -U
bind -n M-S-Up resize-pane -U 2
bind -n M-k select-pane -U
bind -n M-K resize-pane -U 2

# Alt+Down: move to lower pane
bind -n M-Down select-pane -D
bind -n M-j select-pane -D
bind -n M-S-Down resize-pane -D 2
bind -n M-J resize-pane -D 2

# Ctrl+b |: split vertically
bind | split-window -h

# Ctrl+b _, Ctrl+b -: split horizontally
bind - split-window -v
bind _ split-window -v

# Status bar position
set -g status-position bottom
set -g status-interval 5

# Colors
set -g status-style 'bg=#1a1a1a fg=#d0d0d0'
set -g message-style 'bg=#d0d0d0 fg=#1a1a1a'

# Left: session name
set -g status-left-length 40
set -g status-left '#[bg=#d0d0d0,fg=#1a1a1a,bold] #S #[bg=#1a1a1a,fg=#d0d0d0]'

# Right: date time host
set -g status-right-length 80
set -g status-right '#[fg=#606060]  %d %b #[fg=#d0d0d0] %H:%M #[fg=#d0d0d0,bold] #h '

# Window tabs
set -g window-status-format ' #W '
set -g window-status-current-format '#[bg=#2e2e2e,fg=#ffffff,bold] #W '
set -g window-status-style 'fg=#606060'
set -g window-status-current-style 'fg=#ffffff'
set -g window-status-separator ''

# Pane borders
set -g pane-border-style 'fg=#2e2e2e'
set -g pane-active-border-style 'fg=#d0d0d0'

# Pane number display
set -g display-panes-colour '#606060'
set -g display-panes-active-colour '#ffffff'

